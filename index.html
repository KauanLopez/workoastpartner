<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkoastPartner</title>
  <link rel="icon" type="image/png"
    href="https://media.licdn.com/dms/image/v2/D4D0BAQEOfFvQZ5wlhw/company-logo_200_200/company-logo_200_200/0/1698861766133/workoast_logo?e=2147483647&v=beta&t=7VZcCV5p6RHzOvBROOi3P5nIDBcSEql14HswDk4fDLQ" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Lexend:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            // Brand Green (from design system)
            brand: {
              50: "#F3FFE6",
              100: "#E4FFC7",
              200: "#C8FF8F",
              300: "#A6FF4D",
              DEFAULT: "#75FA00",
              500: "#75FA00",
              600: "#5FD100",
              700: "#2F7A00",
              800: "#1F5200",
              900: "#143300",
            },
            primary: "#75FA00",
            "primary-hover": "#5FD100",

            // Neutral Greys
            neutral: {
              0: "#FFFFFF",
              25: "#FAFAF9",
              50: "#F3F3F2",
              100: "#EBEBEA",
              150: "#E2E2E0",
              200: "#D4D4D1",
              300: "#B8B8B4",
              400: "#91918C",
              500: "#6D6D68",
              600: "#51514D",
              700: "#393936",
              800: "#262624",
              900: "#191918",
              950: "#0E0E0D",
            },

            // Semantic mappings
            "bg-app": "var(--bg-app)",
            "surface-card": "var(--surface-card)",
            "surface-raised": "var(--surface-raised)",
            "surface-sunken": "var(--surface-sunken)",
            "surface-hover": "var(--surface-hover)",
            "surface-brand": "var(--surface-brand)",
            "surface-brand-soft": "var(--surface-brand-soft)",
            "surface-inverse": "var(--surface-inverse)",

            "border-subtle": "var(--border-subtle)",
            "border-default": "var(--border-default)",
            "border-strong": "var(--border-strong)",

            "text-primary": "var(--text-primary)",
            "text-secondary": "var(--text-secondary)",
            "text-tertiary": "var(--text-tertiary)",
          },
          fontFamily: {
            sans: ["Geist", "system-ui", "sans-serif"],
            display: ["Lexend", "system-ui", "sans-serif"],
            mono: ["Geist Mono", "ui-monospace", "monospace"],
          },
          borderRadius: {
            card: "20px",
            nested: "16px",
            btn: "999px",
            control: "12px",
            pill: "999px",
            dialog: "24px",
          },
          boxShadow: {
            xs: "var(--shadow-xs)",
            sm: "var(--shadow-sm)",
            md: "var(--shadow-md)",
            lg: "var(--shadow-lg)",
          }
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/index.css" />
  <style>
    body {
      font-family: 'Geist', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: var(--bg-app);
      color: var(--text-primary);
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #A1A1AA;
      /* Secondary text color */
      border-radius: 99px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #71717A;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #3F3F46;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #52525B;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^18.3.1/",
    "react-dom": "https://aistudiocdn.com/react-dom@^18.3.1",
    "react/": "https://aistudiocdn.com/react@^18.3.1/",
    "react": "https://aistudiocdn.com/react@^18.3.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^0.1.2",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^4.3.1",
    "vite": "https://aistudiocdn.com/vite@^5.3.1",
    "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom"
  }
}
</script>
</head>

<body
  class="bg-[var(--bg-app)] text-[var(--text-primary)] transition-colors duration-150">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
